<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 전화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!-- Supabase 라이브러리 (실시간 통신용) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --ink: #3b3355; --muted: #8b84a3; --paper: #ffffff; --bg: #fff6dc; --line: #ece4d3;
    --yellow: #ffd84d; --yellow-soft: #fff4c2; --pink: #ff9ec4; --pink-soft: #ffe3ef; --mint: #8fe3c8; --mint-soft: #ddf8ee;
    --sky: #9cc9ff; --sky-soft: #e3f0ff; --lav: #c4b2ff; --lav-soft: #efe9ff;
    --accent: #7b61ff; --good: #22b573; --bad: #ff5c7a; --warn: #ffa63d;
    --radius: 22px; --pop: 4px 4px 0 var(--ink);
    --display: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--ink); background-color: var(--bg);
    background-image: radial-gradient(#ffd9a0 1.6px, transparent 1.8px); background-size: 24px 24px;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; }
  .hidden { display: none !important; }
  .off { visibility: hidden; }

  button { font: inherit; color: var(--ink); cursor: pointer; background: var(--paper); border: 3px solid var(--ink);
    border-radius: 16px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s, background .15s; }
  button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--yellow); font-family: var(--display); font-size: 19px; }
  input, select { font: inherit; color: var(--ink); padding: 11px 14px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; outline: none; }
  input:focus, select:focus { background: var(--yellow-soft); }
  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: var(--radius); box-shadow: var(--pop); }
  .banner { background: var(--yellow-soft); border-bottom: 3px solid var(--ink); padding: 6px 16px; font-size: 13px; text-align: center; }

  /* 입장 화면 */
  #join { max-width: 440px; margin: 48px auto; padding: 30px 30px 28px; position: relative; }
  #join .logo { text-align: center; font-size: 46px; line-height: 1; }
  #join h1 { font-size: 46px; text-align: center; margin-top: 6px; letter-spacing: 1px; }
  #join h1 span { display: inline-block; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
  #join h1 span:nth-child(odd) { transform: rotate(-4deg); } #join h1 span:nth-child(even) { transform: rotate(4deg) translateY(2px); }
  #join .sub { color: var(--muted); margin: 10px 0 20px; text-align: center; font-size: 15px; }
  #join .sub.err { color: var(--bad); font-weight: 700; }
  #join label { display: block; font-family: var(--display); font-size: 17px; margin: 14px 0 6px; }
  #join input { width: 100%; }
  #join .joinhelp { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
  #join .row { display: flex; gap: 12px; margin-top: 24px; }
  #join .row > * { flex: 1; padding: 12px; font-family: var(--display); font-size: 20px; }
  #join .deco { position: absolute; font-size: 30px; }
  .watchbtn { width: 100%; margin-top: 12px; font-size: 15px; background: var(--sky-soft); }

  /* 게임 화면 */
  #game { max-width: 1280px; margin: 0 auto; padding: 16px 16px 28px; }
  .topbar { display: grid; grid-template-columns: 230px 1fr 100px; gap: 12px; align-items: center; padding: 12px 18px; }
  .roombox { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .roomchip { font-family: var(--display); font-size: 20px; background: var(--lav-soft); border: 3px solid var(--ink); padding: 4px 14px; border-radius: 999px; }
  .copy { font-size: 13px; padding: 5px 12px; box-shadow: 2px 2px 0 var(--ink); }
  .center { text-align: center; min-width: 0; display: grid; grid-template-rows: 30px 14px 24px; align-items: center; justify-items: center; }
  .qinfo { font-family: var(--display); font-size: 22px; }
  .qinfo b { font-weight: 400; font-size: 26px; color: var(--accent); }
  .progress { display: flex; gap: 3px; justify-content: center; width: min(100%, 440px); }
  .progress i { flex: 1 1 0; max-width: 16px; min-width: 3px; height: 9px; border-radius: 5px; background: #efe8da; border: 2px solid #e2d8c4; }
  .progress i.done { background: var(--accent); border-color: var(--ink); }
  .progress i.now { background: var(--yellow); border-color: var(--ink); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .status { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .timerwrap { display: flex; justify-content: flex-end; }
  .timer { position: relative; width: 80px; height: 80px; }
  .timer svg { transform: rotate(-90deg); }
  .timer .track { stroke: #f1e9dc; }
  .timer .bar { stroke: var(--good); transition: stroke-dashoffset .25s linear, stroke .3s; }
  .timer .face { position: absolute; inset: 9px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  .timer .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 26px; }
  .timer.mid .bar { stroke: var(--warn); }
  .timer.low .bar { stroke: var(--bad); }
  .timer.low .num { color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.25); } }

  .layout { display: grid; grid-template-columns: 220px 1fr 290px; gap: 16px; margin-top: 16px; align-items: start; }
  .panel-title { font-family: var(--display); font-size: 19px; padding: 14px 16px 8px; }

  #players { list-style: none; margin: 0; padding: 4px 10px 12px; }
  #players li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 16px; margin-bottom: 8px; border: 2px solid transparent; background: #faf7f0; }
  #players li.done { background: var(--mint-soft); border-color: var(--ink); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; border: 2px solid var(--ink); }
  .pinfo { flex: 1; min-width: 0; }
  .pname { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display: flex; gap: 3px; margin-top: 2px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 0 7px; border-radius: 999px; background: #efe9dd; color: var(--muted); font-weight: 800; }
  .tag.t-host { background: var(--lav); color: var(--ink); }
  .tag.t-spec { background: var(--sky-soft); color: var(--ink); }

  /* 가운데 무대 */
  .stagecard { padding: 16px; min-height: 480px; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .pane { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
  .pane h2, #stage h2 { font-size: 28px; }
  .pane p, #stage p { margin: 0; color: var(--muted); font-size: 14px; }
  .bigicon { font-size: 44px; line-height: 1; }
  .pane input[type=text], .pane input#txt { width: 100%; max-width: 520px; font-size: 18px; text-align: center; }
  .choices { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .pic { display: block; width: 100%; max-width: 560px; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--pop); }
  .bubble { background: var(--yellow-soft); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 20px; font-family: var(--display); font-size: 24px; max-width: 560px; word-break: keep-all; line-height: 1.4; box-shadow: var(--pop); }
  .bubble.none { background: #f4f0e6; color: var(--muted); font-size: 18px; box-shadow: none; }
  .drawhead { font-size: 15px; color: var(--muted); }
  .drawhead b { display: block; font-family: var(--display); font-weight: 400; font-size: 26px; color: var(--ink); margin-top: 4px; word-break: keep-all; }
  canvas#board { display: block; width: 100%; max-width: 800px; aspect-ratio: 4 / 3; background: #fff; border-radius: 16px; border: 3px solid var(--yellow); touch-action: none; cursor: crosshair; }

  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 10px; background: #fffaf0; border: 2px dashed #e2d8c4; border-radius: 16px; }
  .tools .sep { width: 3px; height: 26px; background: var(--line); border-radius: 2px; margin: 0 2px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 3px solid var(--ink); box-shadow: none; }
  .swatch:hover:not(:disabled) { box-shadow: none; }
  .swatch.on { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--accent); }
  .sizebtn { width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 var(--ink); }
  .sizebtn i { display: block; border-radius: 50%; background: var(--ink); }
  .sizebtn.on, .toolbtn.on { background: var(--yellow); }
  .toolbtn { font-size: 14px; padding: 6px 12px; box-shadow: 2px 2px 0 var(--ink); }

  /* 대기실 */
  .lobbyplayers { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .lp { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; font-size: 13px; font-weight: 800; animation: bounce .4s; }
  .lp span:last-child { max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lp .avatar { width: 56px; height: 56px; font-size: 30px; border-width: 3px; }
  .lp.ok .avatar { background: var(--mint-soft) !important; box-shadow: 0 0 0 3px var(--good); }
  .lp .empty { width: 56px; height: 56px; border-radius: 50%; border: 3px dashed #d8cfbd; display: flex; align-items: center; justify-content: center; color: #cfc5b1; font-size: 22px; }
  @keyframes bounce { 0% { transform: scale(.5); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .setbox { width: 100%; max-width: 560px; background: #fffaf0; border: 3px solid var(--ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .setrow { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; justify-content: center; font-weight: 700; }
  .setrow .lbl { font-family: var(--display); font-size: 17px; font-weight: 400; }
  .setrow select { padding: 6px 10px; }
  .pill { display: inline-block; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-weight: 800; }
  .togglebtn { font-size: 14px; padding: 6px 14px; background: var(--sky-soft); }
  .specbadge { display: inline-block; font-family: var(--display); background: var(--sky); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 10px; font-size: 14px; }
  .notebox { background: var(--pink-soft); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 12px; font-size: 14px; }
  #startBtn { font-size: 22px; padding: 12px 40px; }

  /* 결과 공개 */
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .step.new { animation: pop .45s both; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.96); } }
  .step .who { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .step .who .avatar { width: 34px; height: 34px; font-size: 19px; }
  .step .lab { font-size: 12px; font-weight: 800; background: var(--lav-soft); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; }
  .arrow { font-size: 22px; line-height: 1; opacity: .7; }
  .bookbtn { font-family: var(--display); font-size: 18px; background: var(--sky-soft); }
  .bookbtn.on { background: var(--yellow); }
  .revhead { font-family: var(--display); font-size: 26px; }
  .revhead small { font-family: "Pretendard", sans-serif; font-size: 13px; color: var(--muted); margin-left: 6px; }

  /* 채팅 */
  .chatbox { display: flex; flex-direction: column; height: calc(100vh - 250px); min-height: 440px; max-height: 720px; overflow: hidden; }
  #log { flex: 1; overflow-y: auto; padding: 4px 12px 10px; font-size: 14px; }
  #log .m { margin: 6px 0; line-height: 1.45; word-break: break-all; background: #f7f4ff; border-radius: 14px 14px 14px 4px; padding: 6px 10px; width: fit-content; max-width: 100%; }
  #log .m .n { font-weight: 800; margin-right: 6px; }
  #log .sys { color: var(--muted); font-size: 12px; text-align: center; margin: 8px 0; }
  #log .info { background: var(--yellow-soft); border: 2px solid var(--ink); font-weight: 800; padding: 6px 10px; border-radius: 12px; text-align: center; margin: 8px 0; }
  .chatform { display: flex; gap: 8px; padding: 10px; border-top: 3px solid var(--ink); background: #fffaf0; }
  .chatform input { flex: 1; min-width: 0; padding: 9px 12px; }
  .chatform button { padding: 8px 14px; font-size: 17px; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 800; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1060px) {
    .layout { grid-template-columns: 1fr; }
    #players { display: flex; flex-wrap: wrap; gap: 6px; }
    #players li { margin: 0; }
    .chatbox { height: 340px; min-height: 0; }
    .topbar { grid-template-columns: 1fr auto; }
    .roombox { grid-column: 1 / -1; flex-direction: row; }
    .center { grid-column: 1; }
  }
</style>
</head>
<body>
<div id="modeBanner" class="banner hidden"></div>
<div id="toast"></div>

<!-- 1) 입장 화면 -->
<section id="join" class="card">
  <span class="deco" style="left:-18px;top:-20px">☎️</span><span class="deco" style="right:-14px;top:30px">⭐</span><span class="deco" style="left:-16px;bottom:40px">🖍️</span>
  <div class="logo">☎️</div>
  <h1><span style="color:#ff9ec4">그</span><span style="color:#ffd84d">림</span> <span style="color:#8fe3c8">전</span><span style="color:#9cc9ff">화</span></h1>
  <p class="sub">문장 → 그림 → 설명 → 그림 … 전달할수록 엉뚱해지는 게임!</p>
  <label for="nameInput">닉네임</label>
  <input id="nameInput" maxlength="10" placeholder="예: 세훈">
  <label for="roomInput">방 번호 (영어·숫자 2~12자)</label>
  <input id="roomInput" maxlength="12" placeholder="예: 1234, sehun, ROOM7">
  <p class="joinhelp">만들 때는 원하는 번호를 정하고, 들어갈 때는 친구가 알려준 번호를 넣어요.<br>비워 두고 방 만들기를 누르면 번호가 자동으로 정해져요.</p>
  <div class="row">
    <button id="createBtn" class="primary">방 만들기</button>
    <button id="enterBtn">입장하기</button>
  </div>
  <button id="watchBtn" class="watchbtn">👀 보기만 할래요 (관전으로 입장)</button>
</section>

<!-- 2) 게임 화면 -->
<section id="game" class="hidden">
  <div class="topbar card">
    <div class="roombox">
      <span class="roomchip">방 <span id="roomCode"></span></span>
      <button id="copyBtn" class="copy">🔗 초대 링크 복사</button>
    </div>
    <div class="center">
      <div id="qinfo" class="qinfo"></div>
      <div id="progress" class="progress"></div>
      <div id="status" class="status"></div>
    </div>
    <div class="timerwrap"><div id="timer" class="timer off">
      <svg width="80" height="80"><circle class="track" cx="40" cy="40" r="34" fill="none" stroke-width="9"/>
        <circle id="timerBar" class="bar" cx="40" cy="40" r="34" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg>
      <div class="face"></div><div id="timerNum" class="num"></div>
    </div></div>
  </div>
  <div class="layout">
    <div class="card">
      <div class="panel-title">👥 참가자</div>
      <ul id="players"></ul>
    </div>
    <div class="card stagecard"><div id="stage"></div></div>
    <div class="card chatbox">
      <div class="panel-title">💬 채팅</div>
      <div id="log"></div>
      <form id="chatForm" class="chatform">
        <input id="chatInput" maxlength="40" autocomplete="off" placeholder="채팅 입력">
        <button class="primary">보내기</button>
      </form>
    </div>
  </div>
</section>

const AV_EMOJI = ["🐶", "🐱", "🐰", "🐻", "🐼", "🦊", "🐸", "🐯", "🐨", "🐹", "🐷", "🐵", "🐥", "🦁", "🐮", "🐙"];

// ===================== 통신 (Supabase 또는 테스트 모드) =====================
function makeSupabaseNet(room) {

  const ch = client.channel("phone-" + room, { config: { broadcast: { self: false }, presence: { key: myId } } });
  const api = { msgFn: null, presFn: null };
  ch.on("broadcast", { event: "m" }, ({ payload }) => api.msgFn && api.msgFn(payload));
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState(), list = {};
    for (const id in st) { const p = st[id][st[id].length - 1]; if (p) list[id] = { name: p.name, joinedAt: p.joinedAt, spec: !!p.spec }; }
    api.presFn && api.presFn(list);

    if (status === "SUBSCRIBED") { await ch.track({ name: myName, joinedAt, spec: mySpec }); api.ready && api.ready(); }
    if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") sysMsg("서버 연결 문제가 생겼어요. 새로고침해 보세요.");
  });

}
function makeLocalNet(room) {

  const emitPres = () => {
    const now = Date.now(), list = { [myId]: { name: myName, joinedAt, spec: mySpec } };
    for (const id in seen) if (now - seen[id].t < 5000) list[id] = seen[id].p; else delete seen[id];
    api.presFn && api.presFn(list);
  };
  bc.onmessage = (e) => {
    const m = e.data;
    if (m.__ping) { const isNew = !seen[m.p.id]; seen[m.p.id] = { p: { name: m.p.name, joinedAt: m.p.joinedAt, spec: !!m.p.spec }, t: Date.now() }; if (isNew) { bc.postMessage({ __ping: 1, p: me() }); emitPres(); } return; }
    if (m.__bye) { delete seen[m.id]; emitPres(); return; }
    api.msgFn && api.msgFn(m);
  };

  addEventListener("beforeunload", bye);
  setTimeout(() => { if (api.closed) return; bc.postMessage({ __ping: 1, p: me() }); emitPres(); api.ready && api.ready(); }, 50);

}

const params = new URLSearchParams(location.search);

function enter(code, mode, spec) {

  code = code.trim().toUpperCase();

  if (!/^[A-Z0-9]{2,12}$/.test(code)) { alertBox("방 번호는 영어나 숫자로 2~12자예요 (띄어쓰기·특수문자 X)"); return; }

  $("join").classList.add("hidden"); $("game").classList.remove("hidden");
  $("roomCode").textContent = code;

// ===================== 접속자 / 방장 =====================
function presentIds() { return Object.keys(present).sort((a, b) => present[a].joinedAt - present[b].joinedAt || (a < b ? -1 : 1)); }

function specIds() { return presentIds().filter((id) => present[id].spec); }
function hostOrder() { return [...playerIds(), ...specIds()]; }
function onPresence(list) {
  const prev = present;
  present = list;
  for (const id in prev) if (!present[id] && settled) sysMsg(`${prev[id].name}님이 나갔어요.`);
  for (const id in present) if (!prev[id] && id !== myId && settled) sysMsg(`${present[id].name}님이 들어왔어요.`);
  const wasHost = isHost;
  isHost = settled && hostOrder()[0] === myId;
  if (isHost) {
    if (!S) S = newLobby();
    if (!wasHost) { sysMsg("👑 내가 방장이 됐어요."); hostEnds = localEnds || Date.now(); }
    const sig = (o) => Object.keys(o).sort().map((k) => k + (o[k].spec ? "s" : "p")).join();
    if (sig(prev) !== sig(present) || !wasHost) pushState();
  }

}
function setSpectator(v) {

  mySpec = v; net.retrack && net.retrack();
  sysMsg(v ? "👀 관전으로 바꿨어요." : "🙋 참가자로 바꿨어요.");

// ===================== 게임 규칙 =====================
// 책(이야기)은 참가자 수만큼 있어요. 책 b는 처음에 order[b]가 문장을 쓰고,
// 한 단계가 지날 때마다 옆 사람(order[(b+단계)%n])에게 넘어가요.
//  0단계: 모두 첫 문장 쓰기 / 홀수 단계: 앞 문장 보고 그리기 / 짝수 단계(2~): 앞 그림 보고 설명하기
const PLAY = ["write", "draw", "describe"];
const kindOf = (r) => (r % 2 === 0 ? "text" : "img");
const phaseOf = (r) => (r === 0 ? "write" : r % 2 === 1 ? "draw" : "describe");
function newLobby() {
  return { phase: "lobby", names: {}, order: [], gid: 0, r: 0, R: 0, writeT: 45, drawT: 80, descT: 45, roundsOpt: 0,
    done: {}, rb: 0, rs: 0, timerTotal: 0, endsIn: 0, note: null };
}
const timeOf = (r) => (r === 0 ? S.writeT : r % 2 === 1 ? S.drawT : S.descT) * 1000;
const holder = (b, r) => S.order[(b + r) % S.order.length];
function bookOf(id, r) { const n = S.order.length, i = S.order.indexOf(id); return i < 0 ? -1 : (((i - r) % n) + n) % n; }
const amPlayer = () => !!(S && S.order && S.order.includes(myId) && !mySpec);

// ===================== 방장 전용: 진행 =====================
function setTimer(ms) { hostEnds = Date.now() + ms; S.timerTotal = ms; }
function pushState() {
  if (!isHost) return;
  S.endsIn = Math.max(0, hostEnds - Date.now());
  emit({ t: "state", s: JSON.parse(JSON.stringify(S)) });
}
function startGame() {
  const ids = playerIds().slice(0, MAX_PLAYERS);
  if (ids.length < MIN_PLAYERS) { sysMsg(`참가자가 ${MIN_PLAYERS}명 이상 있어야 시작할 수 있어요. (관전자는 빼고)`); return; }
  const order = shuffle([...ids]);
  S.names = {}; order.forEach((id) => (S.names[id] = present[id].name));
  S.order = order; S.gid++; S.note = null;
  S.R = Math.min(order.length, S.roundsOpt || order.length);
  S.r = 0; S.done = {}; S.rb = 0; S.rs = 0;
  S.phase = "write"; setTimer(timeOf(0)); pushState();
}
// 시간이 끝났는데 못 낸 사람 자리는 "응답 없음"으로 채워서 다음으로 넘어가요
function fillMissing() {
  const n = S.order.length;
  for (let b = 0; b < n; b++) {
    if (subs[S.r + ":" + b]) continue;
    emit({ t: "sub", g: S.gid, r: S.r, b, by: holder(b, S.r), from: null, kind: kindOf(S.r), data: null, fill: true });

function advance() {
  fillMissing();
  if (S.r + 1 < S.R) { S.r++; S.phase = phaseOf(S.r); S.done = {}; setTimer(timeOf(S.r)); }
  else { S.phase = "reveal"; S.rb = 0; S.rs = 1; S.done = {}; setTimer(0); }
  pushState();
}
setInterval(() => {   // 방장이 0.25초마다 진행 체크
  if (!isHost || !S || !PLAY.includes(S.phase)) return;
  const alive = S.order.filter((id) => present[id]);
  if (alive.length < 2) { S.phase = "lobby"; S.note = "참가자가 너무 적어져서 게임을 멈췄어요."; setTimer(0); pushState(); return; }
  if (alive.every((id) => S.done[id]) || hostEnds - Date.now() < -GRACE_MS) advance();
}, 250);
// 다시 보내 달라는 요청 처리 (한꺼번에 보내지 않고 0.12초에 하나씩)
const resendQ = [];
setInterval(() => {
  if (!isHost || !S || !net || !resendQ.length) return;
  const k = resendQ.shift(), e = subs[k]; if (!e) return;
  const [r, b] = k.split(":").map(Number);
  net.send({ t: "sub", g: S.gid, r, b, by: e.by, from: e.by, kind: e.kind, data: e.data, re: true });
}, 120);

// ===================== 메시지 처리 (모두 공통) =====================
function cleanData(kind, d) {
  if (d == null) return null;
  if (kind === "text") return typeof d === "string" ? (d.replace(/\s+/g, " ").trim().slice(0, 60) || null) : null;
  if (kind === "img") return typeof d === "string" && d.length < 250000 && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(d) ? d : null;
  return null;
}
function handle(m) {

    case "sub": {

const PH_MSG = { write: "✍️ 게임 시작! 다음 사람이 그릴 첫 문장을 써 주세요", draw: "🖍️ 그림 그릴 시간!", describe: "💬 그림을 보고 문장으로 설명해요", reveal: "📖 결과 공개! 이야기가 어떻게 변했을까요?", end: "🏁 모든 이야기가 끝났어요" };

    if (PH_MSG[s.phase] && (s.phase !== "write" || s.gid > 0)) sysMsg(PH_MSG[s.phase] + (PLAY.includes(s.phase) ? ` (${s.r + 1}/${s.R})` : ""), "info");
  }
}

// ===================== 제출 =====================
function doSubmit(auto) {
  if (!S || !amPlayer() || !PLAY.includes(S.phase)) return;
  const key = S.gid + ":" + S.r;
  if (mySubKey === key) return;
  const b = bookOf(myId, S.r); if (b < 0) return;
  let data;
  if (S.phase === "draw") data = exportImg();
  else {
    const el = $("txt"); data = (el && el.value || "").trim();
    if (!data) {
      if (!auto) { toast("먼저 내용을 입력해 주세요"); return; }
      data = S.phase === "write" ? randomSentence() : "(설명 없음)";   // 시간 안에 못 쓰면 대신 채워 줌
    }
  }
  mySubKey = key;
  emit({ t: "sub", g: S.gid, r: S.r, b, by: myId, from: myId, kind: kindOf(S.r), data });

  emit({ t: "chat", from: myId, name: myName, text, spec: mySpec });
};
function addLine(html, cls) {
  const d = document.createElement("div"); d.className = cls || "m"; d.innerHTML = html;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}
function addChat(id, name, text, spec) { addLine(`${spec ? "👀 " : ""}<span class="n" style="color:${avColor(id)}">${esc(name)}</span>${esc(text)}`, "m"); }
function sysMsg(t, cls) { addLine(esc(t), cls || "sys"); }

// ===================== 그림판 =====================
let cv = null, ctx = null, color = "#2b2d42", size = 6, drawing = false, strokes = [], curStroke = null;
const COLORS = ["#2b2d42", "#ff4d6d", "#ff9f1c", "#ffd43b", "#20b26b", "#1c7ed6", "#7048e8", "#8d5524", "#f783ac", "#adb5bd"];
const ERASER = "#ffffff";
function paintStroke(c, s) {
  c.strokeStyle = s.c; c.fillStyle = s.c; c.lineWidth = s.w; c.lineCap = "round"; c.lineJoin = "round";
  if (s.pts.length === 1) { c.beginPath(); c.arc(s.pts[0][0], s.pts[0][1], s.w / 2, 0, Math.PI * 2); c.fill(); return; }
  c.beginPath(); c.moveTo(s.pts[0][0], s.pts[0][1]);
  for (let i = 1; i < s.pts.length; i++) c.lineTo(s.pts[i][0], s.pts[i][1]);
  c.stroke();
}
function redrawAll() {
  if (!ctx) return;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
  strokes.forEach((s) => paintStroke(ctx, s));
}
// 제출용 이미지: 화면 캔버스가 아니라 획 기록으로 새로 그려서 (640x480 JPEG, 용량 제한 안으로)
function exportImg() {
  const out = document.createElement("canvas"); out.width = 640; out.height = 480;
  const c = out.getContext("2d"); c.fillStyle = "#fff"; c.fillRect(0, 0, 640, 480);
  c.scale(0.8, 0.8); strokes.forEach((s) => paintStroke(c, s));
  let q = 0.72, url = out.toDataURL("image/jpeg", q);
  while (url.length > 170000 && q > 0.3) { q -= 0.1; url = out.toDataURL("image/jpeg", q); }
  return url;
}
function canDraw() { return !!(S && S.phase === "draw" && amPlayer() && mySubKey !== S.gid + ":" + S.r && cv && document.body.contains(cv)); }
function pos(e) { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * cv.width / r.width), Math.round((e.clientY - r.top) * cv.height / r.height)]; }
function buildTools() {
  const t = $("tools"); if (!t) return; t.innerHTML = "";
  COLORS.forEach((c) => {
    const b = document.createElement("button"); b.className = "swatch" + (c === color ? " on" : ""); b.style.background = c; b.title = "색 선택";
    b.onclick = () => { color = c; buildTools(); }; t.appendChild(b);
  });
  t.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  [3, 6, 14, 28].forEach((w) => {
    const b = document.createElement("button"); b.className = "sizebtn" + (w === size && color !== ERASER ? " on" : ""); b.title = "굵기 " + w;
    const d = Math.max(4, Math.min(24, w)); b.innerHTML = `<i style="width:${d}px;height:${d}px"></i>`;
    b.onclick = () => { size = w; if (color === ERASER) color = COLORS[0]; buildTools(); }; t.appendChild(b);
  });
  t.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  const er = document.createElement("button"); er.className = "toolbtn" + (color === ERASER ? " on" : ""); er.textContent = "🧽 지우개";
  er.onclick = () => { color = ERASER; size = 28; buildTools(); }; t.appendChild(er);
  const un = document.createElement("button"); un.className = "toolbtn"; un.textContent = "↩️ 되돌리기";
  un.onclick = () => { strokes.pop(); redrawAll(); }; t.appendChild(un);
  const cl = document.createElement("button"); cl.className = "toolbtn"; cl.textContent = "🗑️ 전체 지우기";
  cl.onclick = () => { strokes = []; redrawAll(); }; t.appendChild(cl);
}
function bindDraw() {
  cv = $("board"); ctx = cv.getContext("2d"); strokes = []; curStroke = null; drawing = false; redrawAll(); buildTools();
  cv.addEventListener("pointerdown", (e) => {
    if (!canDraw()) return;
    drawing = true; cv.setPointerCapture(e.pointerId);
    curStroke = { c: color, w: size, pts: [pos(e)] }; strokes.push(curStroke); paintStroke(ctx, curStroke);
  });
  cv.addEventListener("pointermove", (e) => {
    if (!drawing || !curStroke) return;
    if (!canDraw()) { drawing = false; return; }
    const p = pos(e), last = curStroke.pts[curStroke.pts.length - 1];
    curStroke.pts.push(p); paintStroke(ctx, { c: curStroke.c, w: curStroke.w, pts: [last, p] });
  });
  const stop = () => { drawing = false; curStroke = null; };
  cv.addEventListener("pointerup", stop); cv.addEventListener("pointercancel", stop);
  $("subBtn").onclick = () => doSubmit(false);
}
function bindText() {
  const t = $("txt"); if (t) { t.focus(); t.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) doSubmit(false); }); }
  $("subBtn").onclick = () => doSubmit(false);
  const rb = $("rndBtn"); if (rb) rb.onclick = () => { t.value = randomSentence(); t.focus(); };
}

// ===================== 못 받은 조각 다시 요청 =====================
function needKeys() {
  if (!S || !S.order || !S.order.length) return [];
  const n = S.order.length, ks = [];
  if (S.phase === "draw" || S.phase === "describe") { const b = bookOf(myId, S.r); if (b >= 0 && S.r > 0) ks.push((S.r - 1) + ":" + b); }
  else if (S.phase === "reveal" || S.phase === "end") for (let b = 0; b < n; b++) for (let r = 0; r < S.R; r++) ks.push(r + ":" + b);
  return ks.filter((k) => !subs[k]);
}
setInterval(() => {
  if (!net || !S || isHost) return;
  const now = Date.now(), ks = needKeys().filter((k) => !(lastReq[k] > now - 6000));
  if (!ks.length) return;
  ks.forEach((k) => (lastReq[k] = now));
  net.send({ t: "need", g: S.gid, keys: ks, from: myId });
}, 1500);

// ===================== 화면 그리기 =====================
function setHTML(el, html) { if (el._h === html) return false; el._h = html; el.innerHTML = html; return true; }
function setStage(key, html, bind) {   // key가 같으면 다시 안 그려요 (입력 중인 글·그림이 사라지지 않게)
  const st = $("stage"); if (st._k === key) return;
  st._k = key; st.innerHTML = html; if (bind) bind();
}
const PH_NAME = { lobby: "🎨 대기실", write: "✍️ 첫 문장 쓰기", draw: "🖍️ 그림 그리기", describe: "💬 그림 설명하기", reveal: "📖 결과 공개", end: "🏁 게임 끝" };
function render() {
  if (!net) return;
  const ids = presentIds(), hostId = hostOrder()[0];
  const inGame = S && S.order && S.order.length && (PLAY.includes(S.phase) || S.phase === "reveal");
  setHTML($("players"), ids.map((id) => {
    const isPlayer = inGame ? S.order.includes(id) : !present[id].spec;
    const done = S && PLAY.includes(S.phase) && S.done && S.done[id];
    const tags = [id === hostId ? '<span class="tag t-host">👑 방장</span>' : "", id === myId ? '<span class="tag">나</span>' : "", !isPlayer ? '<span class="tag t-spec">👀 관전</span>' : ""].join("");
    return `<li class="${done ? "done" : ""}" data-id="${id}">${avatar(id, present[id].name)}<div class="pinfo"><div class="pname">${esc(present[id].name)}</div><div class="tags">${tags}</div></div>${done ? "✅" : ""}</li>`;
  }).join(""));

  if (!S) { $("qinfo").textContent = ""; $("progress").innerHTML = ""; $("status").textContent = ""; setStage("loading", '<div class="bigicon">⏳</div><h2>연결 중...</h2>'); return; }
  const playing = PLAY.includes(S.phase);
  $("qinfo").innerHTML = PH_NAME[S.phase] + (playing ? ` <b>${S.r + 1}</b> / ${S.R}` : "");
  $("progress").innerHTML = playing ? Array.from({ length: S.R }, (_, i) => `<i class="${i < S.r ? "done" : i === S.r ? "now" : ""}"></i>`).join("") : "";
  $("status").textContent = playing ? `${S.order.filter((id) => present[id] && S.done[id]).length} / ${S.order.filter((id) => present[id]).length}명 제출` : "";
  renderStage();
}
function faces(ids) { return `<div class="lobbyplayers">${ids.map((id) => `<div class="lp ${S.done && S.done[id] ? "ok" : ""}">${avatar(id, nameOf(id))}<span>${esc(nameOf(id))}${S.done && S.done[id] ? " ✅" : ""}</span></div>`).join("")}</div>`; }
function renderStage() {
  const ph = S.phase;
  if (ph === "lobby") return renderLobby();
  if (ph === "reveal") return renderReveal();
  if (ph === "end") return renderEnd();
  // 진행 중 (write / draw / describe)
  const part = amPlayer(), key0 = S.gid + ":" + S.r;
  const submitted = part && (mySubKey === key0 || S.done[myId]);
  if (!part || submitted) {
    const alive = S.order.filter((id) => present[id]), doneN = alive.filter((id) => S.done[id]).length;
    const html = `<div class="pane"><div class="bigicon">${part ? "⏳" : "👀"}</div><h2>${part ? "제출 완료! 다른 사람을 기다리는 중" : "게임이 진행 중이에요"}</h2>
      <p>${part ? `${doneN} / ${alive.length}명 제출` : "이번 판은 구경만 할 수 있어요. 결과 공개 때 같이 봐요!"}</p>${faces(S.order)}</div>`;
    return setStage(html, html);
  }
  const b = bookOf(myId, S.r), prev = S.r > 0 ? subs[(S.r - 1) + ":" + b] : null;
  if (ph === "write") return setStage("w:" + key0, `<div class="pane"><div class="bigicon">✍️</div><h2>첫 문장을 써 주세요</h2>
    <p>다음 사람이 이 문장을 그림으로 그려요. 너무 어렵지 않게, 재밌게!</p>
    <input id="txt" maxlength="60" autocomplete="off" placeholder="예: ${esc(randomSentence())}">
    <div class="choices"><button id="rndBtn">🎲 아무거나</button><button id="subBtn" class="primary">제출 ✅</button></div></div>`, bindText);
  if (!prev) return setStage("load:" + key0, '<div class="pane"><div class="bigicon">⏳</div><h2>앞 사람의 작품을 받아오는 중...</h2></div>');
  if (ph === "draw") return setStage("d:" + key0, `<div class="pane"><div class="drawhead">🎯 이 문장을 그려 주세요<b>${prev.data ? esc(prev.data) : "(앞 사람이 문장을 못 냈어요 — 아무거나 자유롭게 그려요!)"}</b></div>
    <canvas id="board" width="800" height="600"></canvas><div id="tools" class="tools"></div>
    <button id="subBtn" class="primary">그림 제출 ✅</button></div>`, bindDraw);
  // describe
  return setStage("e:" + key0, `<div class="pane"><div class="bigicon">💬</div><h2>이 그림을 한 문장으로 설명해 주세요</h2>
    ${prev.data ? `<img class="pic" src="${prev.data}" alt="앞 사람의 그림">` : "<p>(앞 사람의 그림이 비어 있어요. 자유롭게 문장을 써 주세요)</p>"}
    <input id="txt" maxlength="60" autocomplete="off" placeholder="예: 우산을 쓰고 샤워하는 하마">
    <button id="subBtn" class="primary">제출 ✅</button></div>`, bindText);
}
function renderLobby() {
  const ids = playerIds(), specs = specIds(), hostId = hostOrder()[0];
  const slots = Math.max(0, MIN_PLAYERS - ids.length);
  const list = `<div class="lobbyplayers">${ids.map((id) => `<div class="lp">${avatar(id, present[id].name)}<span>${esc(present[id].name)}${id === hostId ? " 👑" : ""}</span></div>`).join("")}${'<div class="lp"><span class="empty">?</span><span>&nbsp;</span></div>'.repeat(slots)}</div>`;
  const specLine = specs.length ? `<p>👀 관전: ${specs.map((id) => esc(present[id].name)).join(", ")}</p>` : "";
  const toggle = `<button class="togglebtn" id="specToggle">${mySpec ? "🙋 나도 참가할래요" : "👀 관전으로 바꾸기"}</button>`;
  const head = `<h2>☎️ 대기실</h2><p>참가자 ${ids.length}명${specs.length ? ` · 관전 ${specs.length}명` : ""} · ${isHost ? `참가자 ${MIN_PLAYERS}명 이상이면 시작할 수 있어요 (최대 ${MAX_PLAYERS}명)` : "방장(👑)이 시작하길 기다리는 중..."}</p>${mySpec ? '<span class="specbadge">👀 지금 관전 모드예요</span>' : ""}${S.note ? `<div class="notebox">${esc(S.note)}</div>` : ""}`;
  const sel = (id, opts, cur, fmt) => `<select id="${id}">${opts.map((n) => `<option value="${n}" ${n === cur ? "selected" : ""}>${fmt(n)}</option>`).join("")}</select>`;
  const secs = (n) => n + "초", rnd = (n) => (n === 0 ? "참가자 수만큼" : n + "단계까지");
  const how = `<p>흐름: 문장 쓰기 → 그림 → 설명 → 그림 … 마지막에 이야기가 어떻게 변했는지 같이 봐요</p>`;
  let html;
  if (isHost) {
    html = `${head}${list}${specLine}${toggle}${how}
      <div class="setbox">
        <div class="setrow"><span class="lbl">✍️ 문장 쓰기</span>${sel("setW", WRITE_OPTS, S.writeT, secs)}<span class="lbl">🖍️ 그리기</span>${sel("setD", DRAW_OPTS, S.drawT, secs)}</div>
        <div class="setrow"><span class="lbl">💬 설명하기</span>${sel("setE", DESC_OPTS, S.descT, secs)}<span class="lbl">🔁 길이</span>${sel("setR", ROUND_OPTS, S.roundsOpt, rnd)}</div>
      </div>
      <button id="startBtn" class="primary" ${ids.length < MIN_PLAYERS ? "disabled" : ""}>게임 시작! 🚀</button>`;
  } else {
    html = `${head}${list}${specLine}${toggle}${how}
      <div class="setbox"><div class="setrow"><span class="lbl">✍️ 문장</span><span class="pill">${S.writeT}초</span><span class="lbl">🖍️ 그리기</span><span class="pill">${S.drawT}초</span><span class="lbl">💬 설명</span><span class="pill">${S.descT}초</span><span class="lbl">🔁 길이</span><span class="pill">${rnd(S.roundsOpt)}</span></div><p>방장이 정해요</p></div>`;
  }
  setStage(html, html, () => {
    const send = () => emit({ t: "settings", writeT: +$("setW").value, drawT: +$("setD").value, descT: +$("setE").value, roundsOpt: +$("setR").value });
    if (isHost) { ["setW", "setD", "setE", "setR"].forEach((id) => ($(id).onchange = send)); $("startBtn").onclick = () => emit({ t: "start" }); }
    $("specToggle").onclick = () => setSpectator(!mySpec);
  });
}
function chainHTML(b, upto, anim) {
  let h = "";
  for (let s = 0; s < upto; s++) {
    const e = subs[s + ":" + b], by = e ? e.by : S.order[(b + s) % S.order.length];
    const label = s === 0 ? "✍️ 첫 문장" : s % 2 === 1 ? "🎨 그림" : "💬 설명";
    let body;
    if (!e) body = '<div class="bubble none">불러오는 중...</div>';
    else if (e.data == null) body = '<div class="bubble none">(응답이 없어요)</div>';
    else if (e.kind === "img") body = `<img class="pic" src="${e.data}" alt="그림">`;
    else body = `<div class="bubble">${esc(e.data)}</div>`;
    h += `${s ? '<div class="arrow">⬇️</div>' : ""}<div class="step${anim && s === upto - 1 ? " new" : ""}"><div class="who">${avatar(by, S.names[by])}<span>${esc(S.names[by] || "?")}</span><span class="lab">${label}</span></div>${body}</div>`;
  }
  return h;
}
function renderReveal() {
  const n = S.order.length, b = S.rb, shown = S.rs, owner = S.order[b];
  let loaded = 0; for (let s = 0; s < shown; s++) if (subs[s + ":" + b]) loaded++;
  const can = isHost || myId === owner;
  const label = shown < S.R ? "다음 ▶" : b < n - 1 ? "다음 이야기 ▶" : "🏁 마무리";
  const key = `rev:${S.gid}:${b}:${shown}:${loaded}:${can ? 1 : 0}`;
  setStage(key, `<div class="revhead">📖 ${esc(nameOf(owner))}의 이야기<small>${b + 1} / ${n}</small></div>${chainHTML(b, shown, true)}
    ${can ? `<button id="revBtn" class="primary">${label}</button>` : `<p>👤 ${esc(nameOf(owner))}님이 넘기고 있어요</p>`}`, () => {
    const btn = $("revBtn"); if (btn) btn.onclick = () => { btn.disabled = true; emit({ t: "revnext", from: myId, rb: S.rb, rs: S.rs }); };
    const els = $("stage").querySelectorAll(".step"); if (els.length > 1) els[els.length - 1].scrollIntoView({ behavior: "smooth", block: "center" });
  });
}
function renderEnd() {
  const n = S.order.length;
  const books = S.order.map((id, i) => `<button class="bookbtn ${endView === i ? "on" : ""}" data-b="${i}">📖 ${esc(nameOf(id))}의 이야기</button>`).join("");
  const key = `end:${S.gid}:${endView}:${Object.keys(subs).length}:${isHost ? 1 : 0}`;
  setStage(key, `<div class="bigicon">🎉</div><h2>모든 이야기가 끝났어요!</h2><p>보고 싶은 이야기를 눌러서 다시 볼 수 있어요</p>
    <div class="choices">${books}</div>
    ${endView !== null && endView < n ? `<div class="revhead">📖 ${esc(nameOf(S.order[endView]))}의 이야기</div>${chainHTML(endView, S.R, false)}` : ""}
    ${isHost ? '<button id="againBtn" class="primary">🔁 대기실로 돌아가기</button>' : "<p>방장이 다음 판을 정할 거예요</p>"}`, () => {
    $("stage").querySelectorAll(".bookbtn").forEach((btn) => (btn.onclick = () => { endView = endView === +btn.dataset.b ? null : +btn.dataset.b; $("stage")._k = null; render(); }));
    const ag = $("againBtn"); if (ag) ag.onclick = () => emit({ t: "lobby" });
  });
}

// 타이머 표시 + 시간이 끝나면 지금까지 쓴 것/그린 것을 자동 제출
setInterval(() => {
  if (!S) return;
  const leftMs = Math.max(0, localEnds - Date.now()), left = Math.ceil(leftMs / 1000);
  const show = PLAY.includes(S.phase), tm = $("timer"); tm.classList.toggle("off", !show);
  if (!show) return;
  const frac = S.timerTotal ? leftMs / S.timerTotal : 0;
  $("timerNum").textContent = left;
  $("timerBar").style.strokeDashoffset = String(213.6 * (1 - frac));
  tm.classList.toggle("mid", frac <= .5 && left > 10);
  tm.classList.toggle("low", left <= 10);
  if (left <= 0 && amPlayer() && mySubKey !== S.gid + ":" + S.r) doSubmit(true);
}, 200);
</script>
